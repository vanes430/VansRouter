name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure pnpm hoisting config
        shell: bash
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CLI devDependencies
        run: npm install --prefix cli --no-audit --no-fund

      - name: Build Standalone CLI & Pack Tarball (.tgz)
        run: |
          mkdir -p dist-pkg
          cd cli
          npm run build
          npm pack --pack-destination ../dist-pkg

      - name: Get version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload .tgz
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          files: dist-pkg/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
